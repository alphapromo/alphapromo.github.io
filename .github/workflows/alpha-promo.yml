name: Alpha Promo

on:
  schedule:
    # O agendador do GitHub atrasa ou pula horários. Por isso o robô acorda a cada
    # 15 minutos (das 06:30 às 22:45 de Brasília) e faz só o que estiver no horário
    # definido em config.yaml > agenda. Execuções sem tarefa terminam em segundos.
    - cron: "7,22,37,52 9-23 * * *"
    - cron: "7,22,37,52 0-1 * * *"
    - cron: "15 2 * * *"   # teste: 23:15 de Brasília
  workflow_dispatch:
    inputs:
      comando:
        description: "run = automático | curate = refazer as ofertas de hoje | post = publicar uma oferta agora | arte = refazer as artes de hoje"
        type: choice
        options: [run, curate, post, arte, reel, diag]
        default: run
      oferta:
        description: "Número da oferta (para 'post' e 'reel')"
        default: ""
      forcar:
        description: "Forçar (refazer curadoria / republicar)"
        type: boolean
        default: false
      teste:
        description: "Modo teste (não publica nada)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alpha-promo
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ffmpeg (para os Reels)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Rodar o robô
        id: bot
        continue-on-error: true
        env:
          DRY_RUN: ${{ inputs.teste && '1' || '' }}
          GH_PAT: ${{ secrets.GH_PAT }}
          SITE_URL: ${{ vars.SITE_URL }}
          ML_MATT_WORD: ${{ secrets.ML_MATT_WORD }}
          ML_MATT_TOOL: ${{ secrets.ML_MATT_TOOL }}
          ML_TAG: ${{ secrets.ML_TAG }}
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          AMAZON_CLIENT_ID: ${{ secrets.AMAZON_CLIENT_ID }}
          AMAZON_CLIENT_SECRET: ${{ secrets.AMAZON_CLIENT_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
          UPLOADPOST_USER: ${{ secrets.UPLOADPOST_USER }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          CMD="${{ inputs.comando || 'run' }}"
          ARGS=""
          if [ "$CMD" = "post" ] || [ "$CMD" = "reel" ]; then ARGS="--slot ${{ inputs.oferta }}"; fi
          if [ "${{ inputs.forcar }}" = "true" ]; then ARGS="$ARGS --force"; fi
          python -m promobot $CMD $ARGS

      - name: Salvar estado, artes e página
        if: always() && inputs.teste != true
        run: |
          git config user.name "alpha-promo-bot"
          git config user.email "alpha-promo-bot@users.noreply.github.com"
          git add -A state docs
          if git diff --cached --quiet; then echo "nada para salvar"; exit 0; fi
          git commit -m "robô: $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          for i in 1 2 3; do git pull --rebase -X ours && git push && exit 0; sleep 5; done
          exit 1

      - name: Falhou? (o GitHub te avisa por e-mail)
        if: steps.bot.outcome == 'failure'
        run: |
          echo "Alguma publicação falhou. Abra o passo 'Rodar o robô' acima para ver o motivo."
          exit 1
